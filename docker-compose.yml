# Define the services (containers) we need
services:

  # Service 1: MongoDB Database
  mongo:
    image: mongo:7.0                    
    container_name: carefreelancer-db   
    restart: unless-stopped             
    volumes:
      - mongo_data:/data/db             
    networks:
      - app-network                     

  # Service 2: Our Node.js Application
  app:
    build: .                            
    container_name: carefreelancer-app  
    restart: unless-stopped             
    ports:
      - "3000:3000"                     
    environment:                        
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/carefreelancer
      - SESSION_SECRET=carefreelancer-ccs2210-athtech-2026-session-key
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=062653182c0dfc
      - SMTP_PASS=0af5bcdb178286
      - SMTP_FROM=noreply@carefreelancer.example
      - APP_URL=http://localhost:3000
    depends_on:
      - mongo                          
    networks:
      - app-network                     

# Define persistent storage
volumes:
  mongo_data:                         

# Define private network for containers to communicate
networks:
  app-network:
    driver: bridge
